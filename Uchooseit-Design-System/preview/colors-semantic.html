<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; }
  .row + .row { margin-top: 10px; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    font-family: monospace; font-size: 12px;
    background: var(--uc-ink); border: 1px solid var(--uc-line);
  }
  .dot { width: 14px; height: 14px; border-radius: 3px; }
</style>
</head><body>
  <div class="label">Semantic tokens (CSS vars)</div>
  <div class="row"><span class="tag"><span class="dot" style="background:#2995FC;"></span>--uc-accent</span><span style="font-size:13px;color:rgba(255,255,255,.72)">primary action · highlighted word · brand smile</span></div>
  <div class="row"><span class="tag"><span class="dot" style="background:#4DA9FD;"></span>--uc-accent-hover</span><span style="font-size:13px;color:rgba(255,255,255,.72)">CTA hover · link hover</span></div>
  <div class="row"><span class="tag"><span class="dot" style="background:#00BF63;"></span>--uc-success</span><span style="font-size:13px;color:rgba(255,255,255,.72)">savings price ("solo $X/mes")</span></div>
  <div class="row"><span class="tag"><span class="dot" style="background:#FFB200;"></span>--uc-warning</span><span style="font-size:13px;color:rgba(255,255,255,.72)">urgency burst · "MUNDIAL 2026"</span></div>
  <div class="row"><span class="tag"><span class="dot" style="background:#FF3131;"></span>--uc-danger</span><span style="font-size:13px;color:rgba(255,255,255,.72)">strike-through on old price</span></div>
  <div class="row"><span class="tag"><span class="dot" style="background:#1F2530;"></span>--uc-line</span><span style="font-size:13px;color:rgba(255,255,255,.72)">hairline border on black surfaces</span></div>
</body></html>
