<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .swatch { aspect-ratio: 1.05/1; }
</style>
</head><body>
  <div class="label">Brand · primary &amp; accents</div>
  <div class="grid">
    <div class="swatch" style="background:#2995FC;">
      <span class="name">Blue (savings)</span><span class="hex">#2995FC · --uc-blue</span>
    </div>
    <div class="swatch" style="background:#DA82FF;">
      <span class="name">Pink (hover)</span><span class="hex">#DA82FF · --uc-pink</span>
    </div>
    <div class="swatch" style="background:#00BF63;">
      <span class="name">Green (savings $)</span><span class="hex">#00BF63 · --uc-green</span>
    </div>
    <div class="swatch" style="background:#FFB200; color:#1a1300;">
      <span class="name">Orange (urgency)</span><span class="hex">#FFB200 · --uc-orange</span>
    </div>
    <div class="swatch" style="background:#FF3131;">
      <span class="name">Red (strike-thru)</span><span class="hex">#FF3131 · --uc-red</span>
    </div>
  </div>
</body></html>
