<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 14px 12px;
    align-items: center;
  }
  .icon {
    display:flex; flex-direction:column; align-items:center; gap: 6px;
    padding: 10px 6px;
    background: var(--uc-ink);
    border: 1px solid var(--uc-line);
    border-radius: 10px;
  }
  .icon img { width: 22px; height: 22px; filter: brightness(0) invert(1) opacity(.95); }
  .icon span { font-size: 9.5px; color: rgba(255,255,255,0.55); font-family: monospace; }
</style>
</head><body>
  <div class="label">Brand glyph set · in <code style="font-family:monospace;font-size:11px;">assets/icons/</code></div>
  <div class="grid">
    <div class="icon"><img src="../assets/icons/mail.svg"><span>mail</span></div>
    <div class="icon"><img src="../assets/icons/phone.svg"><span>phone</span></div>
    <div class="icon"><img src="../assets/icons/pin.svg"><span>pin</span></div>
    <div class="icon"><img src="../assets/icons/play.svg"><span>play</span></div>
    <div class="icon"><img src="../assets/icons/star.svg"><span>star</span></div>
    <div class="icon"><img src="../assets/icons/check-white.svg"><span>check</span></div>
    <div class="icon"><img src="../assets/icons/close.svg"><span>close</span></div>
    <div class="icon"><img src="../assets/icons/arrow-up.svg"><span>arrow</span></div>
    <div class="icon"><img src="../assets/icons/shopping.svg"><span>shop</span></div>
    <div class="icon"><img src="../assets/icons/food.svg"><span>food</span></div>
    <div class="icon"><img src="../assets/icons/travel.svg"><span>travel</span></div>
    <div class="icon"><img src="../assets/icons/facebook.svg"><span>fb</span></div>
    <div class="icon"><img src="../assets/icons/instagram.svg"><span>ig</span></div>
    <div class="icon"><img src="../assets/icons/linkedin.svg"><span>li</span></div>
    <div class="icon"><img src="../assets/icons/youtube.svg"><span>yt</span></div>
    <div class="icon"><img src="../assets/icons/twitter.svg"><span>tw</span></div>
    <div class="icon"><img src="../assets/icons/error.svg"><span>error</span></div>
    <div class="icon"><img src="../assets/icons/loading.svg"><span>load</span></div>
  </div>
</body></html>
