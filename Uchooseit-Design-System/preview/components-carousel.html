<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .strip {
    position: relative;
    padding: 0 40px;
  }
  .row { display:flex; gap: 22px; justify-content:flex-start; align-items:center; }
  .avatar {
    width: 84px; height: 84px; border-radius: 999px;
    flex-shrink: 0;
    border: 3px solid var(--uc-blue);
    position: relative;
    overflow: hidden;
    background: var(--uc-ink-2);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .avatar::after {
    content: ""; position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.6) 100%);
  }
  .avatar svg { width: 70%; height: 70%; opacity: 0.55; position:relative; z-index:1; margin-bottom:-2px; }
  .avatar .play {
    position:absolute; z-index:2;
    bottom: 4px; left:50%; transform: translateX(-50%);
    width: 18px; height: 18px; border-radius:50%;
    background: var(--uc-blue);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size: 9px;
  }
  .avatar:nth-child(1) { background: linear-gradient(135deg,#d6a37a,#7b4527); }
  .avatar:nth-child(2) { background: linear-gradient(135deg,#f6d3b0,#b97a55); }
  .avatar:nth-child(3) { background: linear-gradient(135deg,#a16f51,#5a311c); }
  .avatar:nth-child(4) { background: linear-gradient(135deg,#9bc5f6,#3a78b6); }
  .avatar:nth-child(5) { background: linear-gradient(135deg,#e1b4d9,#7c3a83); }
  .avatar:nth-child(6) { background: linear-gradient(135deg,#bfd9b2,#3e6f3a); }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 999px;
    border: 1px solid var(--uc-line);
    background: rgba(0,0,0,0.6);
    color: #fff; display:flex; align-items:center; justify-content:center;
    font-size: 14px; cursor: pointer;
  }
  .nav.l { left: 0; } .nav.r { right: 0; }
  .nameline { display:flex; gap: 22px; margin-top: 8px; padding-left:40px; }
  .nameline span { width: 84px; text-align:center; font-size: 10px; color: rgba(255,255,255,0.55); }
</style>
</head><body>
  <div class="label">Community carousel · video-tip avatars</div>
  <div class="strip">
    <button class="nav l">‹</button>
    <div class="row">
      <div class="avatar"><span class="play">▶</span></div>
      <div class="avatar"><span class="play">▶</span></div>
      <div class="avatar"><span class="play">▶</span></div>
      <div class="avatar"><span class="play">▶</span></div>
      <div class="avatar"><span class="play">▶</span></div>
      <div class="avatar"><span class="play">▶</span></div>
    </div>
    <button class="nav r">›</button>
  </div>
  <div class="nameline">
    <span>Mariana</span><span>Diego</span><span>Carla</span><span>Iván</span><span>Sofía</span><span>Lucas</span>
  </div>
</body></html>
