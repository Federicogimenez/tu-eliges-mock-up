<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 30px; }
  .row { display:flex; gap: 12px; align-items:center; flex-wrap: wrap; }
  .row + .row { margin-top: 14px; }
  .tag-pill {
    display:inline-flex; align-items:center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .tag-pill.blue   { background: rgba(41,149,252,0.18); color: var(--uc-blue); }
  .tag-pill.pink   { background: rgba(218,130,255,0.18); color: var(--uc-pink); }
  .tag-pill.green  { background: rgba(0,191,99,0.16); color: var(--uc-green); }
  .tag-pill.orange { background: rgba(255,178,0,0.18); color: var(--uc-orange); }

  .badge-30 {
    display:inline-flex; align-items:center; justify-content:center;
    width: 72px; height: 72px; border-radius: 999px;
    background: var(--uc-blue); color:#fff; font-weight: 800;
    box-shadow: var(--uc-shadow-glow);
  }
  .badge-30 b { font-size: 20px; }
  .badge-30 small { display:block; font-size: 9px; letter-spacing:.16em; }
</style>
</head><body>
  <div class="label">Pills, tags &amp; badges</div>
  <div class="row">
    <span class="tag-pill blue">Comunidad</span>
    <span class="tag-pill pink">Premium</span>
    <span class="tag-pill green">Ahorras $2,500</span>
    <span class="tag-pill orange">Tendencia · Mundial 2026</span>
  </div>
  <div class="row" style="margin-top:22px;">
    <div class="badge-30">
      <div style="text-align:center;"><b>30%</b><br><small>OFF</small></div>
    </div>
    <span style="font-size:13px; color: rgba(255,255,255,0.66);">Discount badge — 72px, blue halo glow.</span>
  </div>
</body></html>
